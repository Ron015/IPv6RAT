name: 🔥 Ravan APK Builder CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 📥 Checkout repo
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    # ☕ Setup Java
    - name: ☕ Setup JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    # 📦 Cache Gradle (speed boost)
    - name: ⚡ Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}

    # 🔐 Generate Keystore (auto)
    - name: 🔐 Generate Keystore
      run: |
        keytool -genkeypair \
          -alias ravan-key \
          -keyalg RSA \
          -keysize 2048 \
          -validity 9125 \
          -keystore ravan-keystore.jks \
          -storepass ravan123 \
          -keypass ravan123 \
          -dname "CN=Ravan Developer, O=Ravan Security, C=US"

        echo "storeFile=ravan-keystore.jks" > keystore.properties
        echo "storePassword=ravan123" >> keystore.properties
        echo "keyAlias=ravan-key" >> keystore.properties
        echo "keyPassword=ravan123" >> keystore.properties

    # 🔧 Make gradlew executable
    - name: 🔧 Grant Permission
      run: chmod +x gradlew

    # 🏗 Build Signed APK
    - name: 🏗 Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    # 📦 Upload Signed APK
    - name: 📦 Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: signed-apk
        path: app/build/outputs/apk/release/app-release.apk

    # 🧪 Build Unsigned APK
    - name: 🧪 Build Unsigned APK
      run: ./gradlew assembleRelease -PdisableSigning --no-daemon

    # 📦 Upload Unsigned APK
    - name: 📦 Upload Unsigned APK
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-apk
        path: |
          app/build/outputs/apk/release/app-release-unsigned.apk
          app/build/outputs/apk/release/app-release.apk

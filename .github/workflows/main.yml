name: 🔥 Ravan APK Builder CI (Java 17)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 📥 Checkout
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    # ☕ Setup Java 17
    - name: ☕ Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # ⚡ Cache Gradle
    - name: ⚡ Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    # 🔐 Keystore
    - name: 🔐 Generate Keystore
      run: |
        keytool -genkeypair \
          -alias ravan-key \
          -keyalg RSA \
          -keysize 2048 \
          -validity 9125 \
          -keystore ravan-keystore.jks \
          -storepass ravan123 \
          -keypass ravan123 \
          -dname "CN=Ravan Developer, O=Ravan Security, C=US"

        echo "storeFile=ravan-keystore.jks" > keystore.properties
        echo "storePassword=ravan123" >> keystore.properties
        echo "keyAlias=ravan-key" >> keystore.properties
        echo "keyPassword=ravan123" >> keystore.properties

    # 🔧 Permission
    - name: 🔧 Grant Permission
      run: chmod +x gradlew

    # 🏗 Build
    - name: 🏗 Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    # 📦 Upload APK
    - name: 📦 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk
